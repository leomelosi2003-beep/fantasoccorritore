name: esito-sql
on: workflow_dispatch
jobs:
  leggi:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "VERSIONE SITO: $(curl -sf -m 30 https://fantaserver.tail9a3baf.ts.net/api/version)"
          curl -sf -m 30 https://fantaserver.tail9a3baf.ts.net/api/sql-status | jq -r '.[] | "=== \(.file) rc=\(.rc) \(.at)\n\(.out)\n"'
